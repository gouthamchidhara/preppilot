name: iOS release (EAS build + TestFlight)

# Manual only: Actions tab -> "iOS release" -> Run workflow.
# Needs the EXPO_TOKEN repository secret. Signing credentials and the App Store Connect
# API key live on Expo's servers (see docs/IOS-RELEASE-RUNBOOK.md).
on:
  workflow_dispatch:
    inputs:
      submit:
        description: Upload the finished build to TestFlight
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        working-directory: .
        run: npm test
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: Build on EAS
        run: eas build -p ios --profile production --non-interactive --no-wait ${{ inputs.submit && '--auto-submit' || '' }}
