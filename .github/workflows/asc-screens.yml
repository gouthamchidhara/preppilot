name: App Store screenshots upload

# Replaces the iPhone screenshots (and the App Review screenshots and notes for Pro and Live AI) of the version being prepared with store/screenshots/*.png,
# using the App Store Connect key in GitHub secrets. Run by hand from the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Upload screenshots
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: node scripts/asc-screens.mjs && node scripts/asc-review.mjs
