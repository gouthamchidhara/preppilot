name: Refresh interview questions

# Daily: reads recent Stack Overflow and Hacker News trends per topic, has the AI write a few new
# original questions, fact-checks them, appends them to the packs, commits, then deploys.
# Needs repository secrets AZURE_OPENAI_ENDPOINT and AZURE_OPENAI_API_KEY.
# Scheduled runs only start once this file is on the default branch (main).
on:
  schedule:
    - cron: '17 6 * * *' # every day 06:17 UTC
  workflow_dispatch:
    inputs:
      per:
        description: New questions to try per topic
        default: '1'

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh-questions
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Write new questions
        env:
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
        run: node scripts/refresh-questions.mjs --per ${{ inputs.per || '1' }}
      - name: Refresh the tech feed
        env:
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
        run: node scripts/build-trending.mjs || echo "feed refresh skipped"
      - run: npm test
      - name: Commit and deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- web/content content-src && git diff --quiet --cached -- web/content; then echo "No new questions today"; exit 0; fi
          git config user.name "preppilot-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/content content-src
          git commit -m "Daily question refresh $(date -u +%Y-%m-%d)"
          git push
          gh workflow run deploy.yml --ref "${GITHUB_REF_NAME}"
